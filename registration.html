<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>College Event Registration</h2>

    <form id="registrationForm">
        <label>Student Name:</label><br>
        <input type="text" id="name" required><br><br>

        <label>Email:</label><br>
        <input type="email" id="email" required><br><br>

        <label>Department:</label><br>
        <input type="text" id="department" required><br><br>

        <label>Year:</label><br>
        <select id="year" required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>
        <br><br>

        <label>Event:</label><br>
        <select id="event" required>
            <option value="">Select Event</option>
            <option>Coding Contest</option>
            <option>Paper Presentation</option>
            <option>Hackathon</option>
            <option>Quiz Competition</option>
        </select>
        <br><br>

        <button type="submit">Register</button>
    </form>

    <h3>Registration Details</h3>
    <div id="output"></div>

    <script src="script.js"></script>

</body>
</html>
